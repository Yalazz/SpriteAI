version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: spriteai-postgres
    environment:
      POSTGRES_DB: spriteai
      POSTGRES_USER: yalaz
      POSTGRES_PASSWORD: yalaz4713
    ports:
      - "5432:5432"
    networks:
      - spriteai-net
    volumes:
      - spriteai_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: spriteai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: spriteai.engine@gmail.com
      PGADMIN_DEFAULT_PASSWORD: yalaz4713
    ports:
      - "5055:80"
    depends_on:
      - postgres
    networks:
      - spriteai-net

  redis:
    image: redis:7
    container_name: spriteai-redis
    ports:
      - "6379:6379"
    networks:
      - spriteai-net

  backend:
    build: ../spriteai-backend
    container_name: spriteai-backend
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_NAME: spriteai
      DB_USER: yalaz
      DB_PASS: yalaz4713
    ports:
      - "8082:8080"
    networks:
      - spriteai-net

  ai:
    build: ../spriteai-ai
    container_name: spriteai-ai
    ports:
      - "8000:8000"
    networks:
      - spriteai-net

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: spriteai-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50001:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - spriteai-net

volumes:
  spriteai_pgdata:
  jenkins_home:

networks:
  spriteai-net:
    driver: bridge
