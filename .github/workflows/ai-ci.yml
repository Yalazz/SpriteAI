name: SpriteAI AI Service CI

on:
  push:
    paths:
      - "spriteai-ai/**"
      - ".github/workflows/ai-ci.yml"
  pull_request:
    paths:
      - "spriteai-ai/**"
      - ".github/workflows/ai-ci.yml"

jobs:
  build-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: spriteai-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint / basic test placeholder
        working-directory: spriteai-ai
        run: |
          python -m compileall app
