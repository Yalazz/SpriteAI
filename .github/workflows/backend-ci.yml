name: SpriteAI Backend CI

on:
  push:
    paths:
      - "spriteai-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "spriteai-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Maven
        working-directory: spriteai-backend
        run: mvn -B -DskipTests package

      # Docker build + push kısmı için GHCR veya başka registry ayarlanabilir.
